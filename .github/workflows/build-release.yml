name: Build and release

# Every push builds x86/x64 core, loaders and the settings panel on a Windows
# runner. A GitHub release is published when either
#   - a tag such as v1.2026.1020.1 is pushed, or
#   - main is pushed, the <Version> in control-panel/YMacType.Settings.csproj
#     has no release yet, and doc/release-notes/v<Version>.md exists.
# The release notes come from doc/release-notes/<tag>.md.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (for example 1.2026.1020.1). Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "$env:INPUT_VERSION"
          $publish = 'false'
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME.TrimStart('v')
            $publish = 'true'
          } elseif ($env:REF_NAME -eq 'main' -and -not $version) {
            [xml]$project = Get-Content -Raw control-panel/YMacType.Settings.csproj
            $candidate = ($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
            $notes = "doc/release-notes/v$candidate.md"
            gh release view "v$candidate" --repo '${{ github.repository }}' *> $null
            $released = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if ((Test-Path $notes) -and -not $released) {
              $version = $candidate
              $publish = 'true'
            }
          }
          if (-not $version) {
            $version = '0.0.0.' + '${{ github.run_number }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version '$version' must look like 1.2026.1020.1"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version (publish: $publish)"

      - name: Cache third-party libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-v143-${{ hashFiles('scripts/ci/build-deps.ps1') }}

      - name: Build third-party libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/build-deps.ps1

      - name: Build core, loaders and settings panel
        shell: pwsh
        run: ./scripts/build-release.ps1 -AllowCompilerWarnings -Version '${{ steps.version.outputs.version }}'

      - name: Package
        id: package
        shell: pwsh
        run: |
          $result = ./scripts/package-release.ps1 -Version '${{ steps.version.outputs.version }}'
          $result | Format-List
          "archive=$($result.Archive)" >> $env:GITHUB_OUTPUT
          "sha256=$($result.SHA256)" >> $env:GITHUB_OUTPUT

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.version.outputs.version }}
          path: build-release-*.log
          if-no-files-found: ignore

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: YMacType-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          $notes = "doc/release-notes/$tag.md"
          $body = if (Test-Path $notes) { Get-Content -Raw -Encoding utf8 $notes } else { "YMacType $tag" }
          $body += "`n`nSHA-256: ``${{ steps.package.outputs.sha256 }}``"
          $bodyFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Encoding utf8 -LiteralPath $bodyFile -Value $body
          $archive = '${{ steps.package.outputs.archive }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-run of an existing tag: refresh the asset and notes.
            gh release upload $tag $archive --clobber
            gh release edit $tag --notes-file $bodyFile
          } else {
            # Creates the tag at this commit when it does not exist yet.
            gh release create $tag $archive `
              --title "YMacType $tag" --notes-file $bodyFile --target '${{ github.sha }}'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
