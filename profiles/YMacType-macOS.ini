; YMacType macOS-style profile for Windows 11.
; Grayscale antialiasing with a PingFang-style Chinese UI font.
;
; Encoding: this file MUST stay UTF-8 *with* BOM (or UTF-16 LE with BOM).
; The core's INI parser decodes BOM-less files with the system ANSI code page,
; which turns every Chinese font name below into mojibake and silently
; disables the matching rules.
;
; [FontSubstitutes] targets may list several candidates separated by '|'.
; The first one installed on this machine is used; if none is installed the
; rule is skipped and a warning (code=700) is written to the diagnostics log.

[Preview]
Font=PingFang SC
Color=$000000
Text=YMacType macOS 风格渲染 / The quick brown fox 0123456789
Size=11

[General]
Name=YMacType macOS
HookChildProcesses=1
HintingMode=1
AntiAliasMode=0
NormalWeight=0
BoldWeight=0
ItalicSlant=0
EnableKerning=1
GammaMode=0
LcdFilter=2
BolderMode=0
TextTuning=0
TextTuningR=0
TextTuningG=0
TextTuningB=0
GammaValue=1.2
Contrast=1.0
RenderWeight=1.15
FontLink=1
FontLoader=0
FontSubstitutes=2
UseMapping=0
LoadOnDemand=0
MaxHeight=0
MaxBitmap=0
DirectWrite=1
HintSmallFont=0
CacheMaxFaces=256
CacheMaxSizes=12554432
CacheMaxBytes=12108864
Shadow=0,0,0,0x0,0,0x0

[DirectWrite]
GammaValue=1.15
Contrast=0.8
ClearTypeLevel=0.0
RenderingMode=5

[Experimental]
ColorFont=1

[FontSubstitutes]
Microsoft YaHei=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans
Microsoft YaHei UI=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans
DengXian=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans
SimHei=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans
SimSun=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans
NSimSun=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans
FangSong=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans
KaiTi=PingFang SC|Source Han Sans SC|Noto Sans SC|Noto Sans CJK SC|HarmonyOS Sans SC|MiSans

[Individual]
PingFang SC=1,0,0,0,0,1
苹方=1,0,0,0,0,1
苹方-简=1,0,0,0,0,1
Source Han Sans SC=1,0,0,0,0,1
思源黑体=1,0,0,0,0,1
Noto Sans SC=1,0,0,0,0,1
Noto Sans CJK SC=1,0,0,0,0,1
HarmonyOS Sans SC=1,0,0,0,0,1
MiSans=1,0,0,0,0,1

[Exclude]
; Font family names that must never be re-rendered (one per line).
; Process names do not belong here: use [UnloadDll] to block a program
; completely, or [ExcludeSub] to keep rendering but disable font substitution.

[ExcludeModule]
fontview.exe

[ExcludeSub]
; Input-method UI remains rendered by MacType, but must retain the font face
; selected by the IME so its cached glyph indices stay valid.
TextInputHost.exe
ctfmon.exe
wetype_renderer.exe

