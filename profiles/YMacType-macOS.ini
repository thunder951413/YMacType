; YMacType macOS-style profile for Windows 11.
; Uses the locally installed PingFang SC family and grayscale antialiasing.

[Preview]
Font=PingFang SC
Color=$000000
Text=YMacType macOS 风格渲染 / The quick brown fox 0123456789
Size=11

[General]
Name=YMacType macOS
HookChildProcesses=1
HintingMode=1
AntiAliasMode=0
NormalWeight=0
BoldWeight=0
ItalicSlant=0
EnableKerning=1
GammaMode=0
LcdFilter=2
BolderMode=0
TextTuning=0
TextTuningR=0
TextTuningG=0
TextTuningB=0
GammaValue=1.2
Contrast=1.0
RenderWeight=1.15
FontLink=1
FontLoader=0
FontSubstitutes=2
UseMapping=0
LoadOnDemand=0
MaxHeight=0
MaxBitmap=0
DirectWrite=1
HintSmallFont=0
CacheMaxFaces=256
CacheMaxSizes=12554432
CacheMaxBytes=12108864
Shadow=0,0,0,0x0,0,0x0

[DirectWrite]
GammaValue=1.15
Contrast=0.8
ClearTypeLevel=0.0
RenderingMode=5

[Experimental]
ColorFont=1

[FontSubstitutes]
Microsoft YaHei=PingFang SC
Microsoft YaHei UI=PingFang SC
DengXian=PingFang SC
SimHei=PingFang SC
SimSun=PingFang SC
NSimSun=PingFang SC
